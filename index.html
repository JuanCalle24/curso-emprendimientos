<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta tu grupo — WhatsApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #075E54 0%, #128C7E 50%, #25D366 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }
  h1 { color: #075E54; font-size: 1.5rem; margin-bottom: 8px; }
  .subtitle { color: #667; margin-bottom: 24px; font-size: .95rem; }
  label { display: block; text-align: left; font-weight: 600; color: #333; margin-bottom: 6px; font-size: .9rem; }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.1rem;
    border: 2px solid #dfe5df;
    border-radius: 10px;
    outline: none;
    transition: border-color .2s;
    letter-spacing: .5px;
  }
  input:focus { border-color: #25D366; }
  button {
    width: 100%;
    margin-top: 14px;
    background: #128C7E;
    color: #fff;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #0d6e63; }
  #resultado { margin-top: 24px; }
  .oculto { display: none; }
  .tarjeta {
    border: 2px solid #25D366;
    border-radius: 12px;
    padding: 24px 20px;
    animation: aparecer .3s ease;
  }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tarjeta .grupo-num {
    background: #25D366;
    color: #fff;
    font-weight: 700;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 12px;
  }
  .tarjeta h2 { color: #075E54; font-size: 1.2rem; margin-bottom: 6px; }
  .tarjeta p { color: #667; font-size: .9rem; margin-bottom: 18px; }
  .btn-wsp {
    display: inline-block;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 34px;
    border-radius: 28px;
    font-size: 1.05rem;
    transition: background .2s;
  }
  .btn-wsp:hover { background: #1da851; }
  .error {
    background: #fdecea;
    border-left: 4px solid #d93025;
    color: #8a1f16;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: .9rem;
    text-align: left;
  }
  .aviso {
    margin-top: 24px;
    background: #f1f6f3;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: .8rem;
    color: #556;
  }
  footer { margin-top: 20px; color: #99a; font-size: .78rem; }
</style>
</head>
<body>
  <main class="container">
    <h1>📱 Consulta tu grupo de WhatsApp</h1>
    <p class="subtitle">Escribe tu número de cédula de identidad y te mostraremos únicamente el enlace del grupo que te corresponde.</p>

    <form id="form" autocomplete="off">
      <label for="ci">Número de C.I.</label>
      <input id="ci" type="text" inputmode="text" placeholder="Ej. 6104168" required>
      <button type="submit">Ver mi grupo</button>
    </form>

    <div id="resultado"></div>

    <div class="aviso">
      🔒 Esta página no muestra nombres ni datos personales. Si tu C.I. no aparece, contacta al organizador.
    </div>

    <footer>Organización de grupos — Proyecto</footer>
  </main>

<script>
const DATOS = [["6104168",1],["10026068",1],["4360287",1],["2666939",1],["3499635",1],["5950934",1],["3360695",1],["6791816",1],["2383715",1],["6159633",1],["8409882",1],["9157532",1],["4980434",1],["4801041",1],["4807102",1],["7081338",1],["6799949",1],["6378060",1],["6832733",1],["2301876",1],["2368554",1],["4251679",1],["6074604",1],["6883699",1],["5960485",1],["8264415",1],["2208919",1],["8415412",1],["6952794",1],["1362706",1],["4261767",2],["2681092",2],["6093714",2],["8350459",2],["9999699",2],["3480729",2],["9060383",2],["5742041",2],["4250802",2],["4967116",2],["3356973",2],["6852219",2],["4982210",2],["4377850",2],["3331912",2],["2635503",2],["4326922",2],["10038353",2],["7049800",2],["2016984",2],["4763460",2],["4952969",2],["6874003",2],["2630332",2],["4369225",2],["6887356",2],["4818501",2],["4919217",2],["9875861",2],["4845692",2],["8318114",3],["2695644",3],["3427621",3],["3486838",3],["9980596",3],["9226894",3],["4808712",3],["6199480",3],["6080199",3],["9159898",3],["8415465",3],["8431866",3],["8332659",3],["7068209",3],["4969338",3],["2602654",3],["3323064",3],["4262775",3],["7024261",3],["2374887",3],["2317675",3],["6430736",3],["4303811",3],["6178591",3],["2707295",3],["3455154",3],["4875088",3],["9143558",3],["7801456",3],["4373581",3],["3441401-1T",4],["4895312",4],["9909574",4],["9968611",4],["4937644",4],["6038998",4],["4376075",4],["9960109",4],["6048345",4],["4273503",4],["6181252",4],["2710481",4],["8311371",4],["7029532",4],["6122750",4],["4960313",4],["4275127",4],["4284129",4],["5985367",4],["5983811",4],["9958298",4],["4745843",4],["5956113",4],["3375755",4],["2448092",4],["6077890",4],["4291082",4],["4802627",4]];
const LINKS = {"1":"https://chat.whatsapp.com/HRHva4UAGc7JGdStQ8O04J","2":"https://chat.whatsapp.com/K2faviwQcEqIaNhQKcujd6","3":"https://chat.whatsapp.com/CQtFet3ic8L1Uh3Oh56vNa","4":"https://chat.whatsapp.com/Do2iRrF3mPbBLfrFNKfglr"};

const form = document.getElementById('form');
const input = document.getElementById('ci');
const resultado = document.getElementById('resultado');

form.addEventListener('submit', function (e) {
  e.preventDefault();
  const ci = input.value.trim().toLowerCase();
  resultado.innerHTML = '';
  if (!ci) return;

  const encontrado = DATOS.find(function (d) { return d[0].toLowerCase() === ci; });

  if (!encontrado) {
    resultado.innerHTML = '<div class="error">❌ No se encontró tu C.I. en la lista de participantes. Verifica que esté escrito correctamente o contacta al organizador.</div>';
    return;
  }

  const g = encontrado[1];
  const link = LINKS[g];
  resultado.innerHTML =
    '<div class="tarjeta">' +
      '<div class="grupo-num">' + g + '</div>' +
      '<h2>Tu grupo es el Grupo ' + g + '</h2>' +
      '<p>Únete únicamente a este grupo. Si entras a otro, serás removido por el administrador.</p>' +
      '<a class="btn-wsp" href="' + link + '" target="_blank" rel="noopener">Unirme al Grupo ' + g + ' →</a>' +
    '</div>';
});
</script>
</body>
</html>
